# Basic settings
set -g default-terminal "screen-256color"
set -g history-limit 100000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Change prefix from Ctrl-b to Ctrl-a (like screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Visual bell off
set -g visual-bell off
set -g bell-action none

# Detach automatically when session ends
set -g detach-on-destroy on

# Status bar configuration (equivalent to hardstatus)
set -g status-position bottom
set -g status-style "bg=colour235,fg=white"
set -g status-left-length 20
set -g status-right-length 50
set -g status-left "#[fg=green,bold]#h #[fg=yellow]#S "
set -g status-right "#[fg=green,bold]%Y %m/%d %a %H:%M"

# Window status format
set -g window-status-format "#[fg=white,bg=colour235] #I #W "
set -g window-status-current-format "#[fg=black,bg=red] #I #W "

# Pane border colors
set -g pane-border-style "fg=colour235"
set -g pane-active-border-style "fg=colour240"

# Key bindings
# Resize pane bindings (equivalent to screen's resize mode)
bind r command-prompt -p "resize mode (h/j/k/l):" "run-shell 'echo \"Use Ctrl+r then h/j/k/l to resize\"'"
bind C-r command-prompt -p "resize mode (h/j/k/l):" "run-shell 'echo \"Use Ctrl+r then h/j/k/l to resize\"'"

# Create resize mode equivalent
bind -r h resize-pane -L 1
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 1

# Function keys for window navigation (equivalent to F5/F6)
bind -n F5 previous-window
bind -n F6 next-window

# Additional useful bindings
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind R source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Vi mode
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection

# Cross-platform clipboard support
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' {
        bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
        bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
    } {
        bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    }
}

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Session management
bind S choose-session
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
