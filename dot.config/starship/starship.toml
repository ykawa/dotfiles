# Starship Configuration
# This configuration provides shell integration features

# Add newline before prompt
add_newline = true

# Disable the blank line at the start of the prompt
format = """
$all$character"""

# Replace the "❯" symbol in the prompt with "➜"
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

# Directory module configuration
[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"

# Git status module configuration
[git_status]
conflicted = "🏳"
ahead = "🏎💨"
behind = "😰"
diverged = "😵"
up_to_date = "✓"
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)](green)'
renamed = "👅"
deleted = "🗑"

# Command duration module
[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow)"

# Memory usage module
[memory_usage]
disabled = false
threshold = 70
symbol = "🐏 "
style = "bold dimmed red"

# Username module
[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "

# Hostname module
[hostname]
ssh_only = false
format = "on [$hostname](bold blue) "
disabled = false

# Python module
[python]
symbol = "🐍 "
style = "yellow bold"
format = "[$symbol($version )($virtualenv)]($style)"

# Node.js module
[nodejs]
symbol = "⬢ "
style = "bold green"
format = "[$symbol($version )]($style)"

# Rust module
[rust]
symbol = "🦀 "
style = "bold red"
format = "[$symbol($version )]($style)"

# Go module
[golang]
symbol = "🐹 "
style = "bold cyan"
format = "[$symbol($version )]($style)"

# Docker context module
[docker_context]
symbol = "🐳 "
style = "blue bold"
format = "[$symbol$context]($style) "

# AWS module
[aws]
symbol = "☁️  "
style = "bold yellow"
#format = "[$symbol($profile)(\($region\))]($style) "

# Kubernetes module
[kubernetes]
format = "on [⛵ $context \\($namespace\\)](dimmed green) "
disabled = false

# Battery module
[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "🔋"

# Time module
[time]
disabled = false
format = "🕙 [$time](bold blue)"
time_format = "%T"
utc_time_offset = "local"
time_range = "-"

# Line break module
[line_break]
disabled = false

# Jobs module
[jobs]
symbol = "+"
style = "bold blue"
number_threshold = 1
symbol_threshold = 1
format = "[$symbol$number]($style) "

# Status module
[status]
style = "bold red"
symbol = "✖"
success_symbol = "✓"
not_executable_symbol = "🚫"
not_found_symbol = "🔍"
sigint_symbol = "🧱"
signal_symbol = "⚡"
format = '[\[$symbol $common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
disabled = false

# Fill module
[fill]
symbol = " "
style = "black"
