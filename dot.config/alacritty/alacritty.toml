# ~/.alacritty.toml

[general]
live_config_reload = true
import = [
  "~/.config/alacritty/themes/themes/tokyo_night.toml"
]

[terminal]
shell = { program = "/bin/bash", args = ["-lc", "zellij || true; exec /bin/bash -l"] }

# 端末タイプ
[env]
TERM = "xterm-256color"

[window]
decorations = "None"
opacity = 0.8
padding = { x = 0, y = 0 }
dimensions = { columns = 1000, lines = 500 }
dynamic_title = true
# startup_mode = "Windowed" | "Maximized" | "Fullscreen" | "SimpleFullscreen"
startup_mode = "SimpleFullscreen"
# decorations_theme_variant = "Dark" | "Light" | "None"
decorations_theme_variant = "None"

[scrolling]
history = 100000

[font]
size = 11.75

[font.normal]
family = "Source Han Code JP R"

[font.bold]
family = "Source Han Code JP R"

[font.italic]
family = "Source Han Code JP R"

[font.offset]
x = 0
y = 0

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
blink_timeout = 0

[cursor.vi_mode_style]
shape = "Block"

[colors]
cursor = { text = "#003784", cursor = "#00a0e4" }

[selection]
# 単語選択の区切り
semantic_escape_chars = " '\"{}[](),"

# コピペ
save_to_clipboard = true

[mouse]
bindings = [
  { mouse = "Middle",                 action = "Paste" },
  { mouse = "Middle", mods = "Shift", action = "Paste" }
]

# ===== キーバインド =====
[[keyboard.bindings]]
key = "Delete"
mods = "Control"
chars = "\u001bd"         # Alt+d

[[keyboard.bindings]]
key = "Backspace"
mods = "Control"
chars = "\u0017"          # Ctrl+w

[[keyboard.bindings]]
key = "Left"
mods = "Control"
chars = "\u001bb"         # Alt+b

[[keyboard.bindings]]
key = "Right"
mods = "Control"
chars = "\u001bf"         # Alt+f

[[keyboard.bindings]]
key = "Up"
mods = "Shift"
action = "ScrollLineUp"

[[keyboard.bindings]]
key = "Down"
mods = "Shift"
action = "ScrollLineDown"

# Ctrl+, で ~/.alacritty.toml を Cursor で開く（必要に応じてエディタ名/パスを変更）
[[keyboard.bindings]]
key = "Comma"
mods = "Control"
command = { program = "sh", args = ["-lc", "cursor ~/.config/alacritty/alacritty.toml"] }

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

# Alt+1 → zellij タブ1
[[keyboard.bindings]]
key = "Key1"
mods = "Alt"
command = { program = "zellij", args = ["action", "go-to-tab", "1"] }

