# Hyprpaper configuration

# Preload desired wallpapers
preload = /usr/share/wallpapers/cachyos-wallpapers/Skyscraper.png

# Assign wallpaper per monitor. Replace "," (blank) with actual names from `hyprctl monitors`.
# Example: wallpaper = eDP-1,/usr/share/wallpapers/cachyos-wallpapers/Skyscraper.png
wallpaper = ,/usr/share/wallpapers/cachyos-wallpapers/Skyscraper.png

# Optional tweaks
ipc = on
splash = false
