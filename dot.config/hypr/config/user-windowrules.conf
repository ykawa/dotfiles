# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃         User Window Rules (App-specific Floating)           ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
#
# ここにユーザー固有の windowrule を記載します。
# 例: 特定アプリを常にフロート（タイルにしない）にする。
#
# 使い方:
# 1) 対象ウィンドウをアクティブにして以下でクラス/タイトルを確認
#      hyprctl activewindow -j | jq -r '.class, .title'
#    あるいは全クライアント一覧
#      hyprctl clients -j | jq -r '.[] | .class + "\t" + (.title // "")'
# 2) 必要に応じて class または title で正規表現を指定
# 3) 下記のコメントアウトを外す/追加する
#
# よくある例:
# windowrule = float, class:^(pavucontrol)$
# windowrule = float, class:^(blueman-manager)$
# windowrule = float, class:^(nm-connection-editor)$
# windowrule = float, class:^(vlc|mpv)$
# windowrule = float, class:^(org.gnome.Calculator)$
# windowrule = size 1200 800, class:^(Gimp)$
# windowrule = move 15% 10%, class:^(Gimp)$
#
# 必要であればタイル化を強制する例（デフォルトを上書き）
# windowrule = tile, class:^(foot)$

## --- User rules -----------------------------------------------------------
# MComix を常にフロート（タイルにしない）
# マッチ強化: 大文字/小文字差分や接尾辞を吸収、タイトルでも拾う
windowrulev2 = float, class:^(M[Cc]omix( .*)?)$
windowrulev2 = float, title:^(.*M[Cc]omix.*)$

# サイズ指定
windowrulev2 = size 1680 1080, class:^(M[Cc]omix( .*)?)$

# 位置調整は起動後スクリプトで正確に行うため、move ルールは撤去
