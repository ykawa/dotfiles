# ┃                     Defaults Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛


# General
$filemanager = thunar
# Rofi launcher with explicit keybindings to ensure arrow navigation works
# Use wofi for a Wayland-native, reliable launcher (arrow keys OK)
$applauncher = wofi --show drun --allow-images --insensitive --cache-file ~/.config/wofi/.cache --style ~/.config/wofi/style.css
$terminal = alacritty
$idlehandler = swayidle -w timeout 300 'swaylock -f -c 000000' before-sleep 'swaylock -f -c 000000'

# Screenshots (no hyprland-contrib)
# Requires: grim, slurp, wl-clipboard
# NOTE: 現状 window 用も選択範囲指定（slurp）で取得します（依存増やさず簡易運用）
$shot-region = bash -lc 'grim -g "$(slurp)" - | wl-copy'
$shot-window = bash -lc 'grim -g "$(slurp)" - | wl-copy'
$shot-screen = grim - | wl-copy
