# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/Configuring/Keywords/#executing

exec-once = hyprpaper
# Waybar: use user config and user style (sleek theme)
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = fcitx5 -d
exec-once = mako
exec-once = nm-applet --indicator
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob & disown"
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wezterm

# ## Slow app launch fix
exec-once = systemctl --user import-environment
exec-once = hash dbus-update-activation-environment 2>/dev/null
exec-once = dbus-update-activation-environment --systemd

# ## Idle configuration
exec-once = $idlehandler

# Clipboard: X11-like select-to-copy on Wayland
# Store both clipboard and primary selections into cliphist, and sync primary → clipboard
exec-once = wl-paste --watch cliphist store --no-persist
exec-once = wl-paste --type text --primary --watch cliphist store --no-persist
exec-once = bash -lc "~/.config/hypr/scripts/primary-to-clipboard.sh"

