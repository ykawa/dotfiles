# ┃                    Input Configuration                      ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

input {
    kb_layout = jp
    kb_variant = 
    kb_model = jp106
    # Keep Super as-is and map Right Alt to Super (mod4) as well
    # Requires xkeyboard-config option: altwin:swap_ralt_rwin
    kb_options = ctrl:nocaps,altwin:swap_ralt_rwin
    kb_rules = 

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.5
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification
    accel_profile = flat
    force_no_accel = false

    # Faster key repeat
    # Increase characters per second and reduce delay before repeat starts
    repeat_rate = 60   # default ~25; higher is faster (e.g. 40-80)
    repeat_delay = 200 # ms before repeating starts (e.g. 150-300)
}

